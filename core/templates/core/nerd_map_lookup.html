    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'core/images/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/images/apple-touch-icon-bg.png' %}">
    <link rel="manifest" href="{% static 'core/site.webmanifest' %}">

        }

            background-image:

                radial-gradient(white, rgba(255,255,255,.1) 1.5px, transparent 35px);
            background-size: 400px 400px, 300px 300px, 200px 200px;
            background-position: 0 0, 30px 40px, 90px 180px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            margin-top: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
        }
        
        h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .back-link {
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s, transform 0.2s;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-link:hover {
            color: #ffdd33;
            transform: translateX(-3px);
        }
        
        /* Glassmorphic Control Panel */
        .control-panel {
            background: rgba(0, 44, 88, 0.55);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15);
            backdrop-filter: blur(5px);
        }
        
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 250px;
        }
        
        label {
            font-weight: bold;
            color: #00ffcc;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input[type="date"] {
            background: #001122;
            border: 2px solid #0099ff;
            border-radius: 4px;
            color: white;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input[type="date"]:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        
        .btn-preset {
            background: rgba(0, 153, 255, 0.2);
            border: 1px solid #0099ff;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        
        .btn-preset:hover {
            background: rgba(0, 255, 204, 0.3);
            border-color: #00ffcc;
        }
        
        .server-selector {
            display: flex;
            background: #001122;
            border: 2px solid #0099ff;
            border-radius: 4px;
            padding: 2px;
            flex: 1 1 300px;
        }
        
        .server-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
            border-radius: 2px;
        }
        
        .server-tab.active {
            background: #00ffcc;
            color: #001f3f;
        }
        
        /* Result Layout */
        .results-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .results-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .result-card {
            background: rgba(0, 34, 68, 0.65);
            border: 2px solid #0099ff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .result-card.creative-card {
            border-color: #ff9900;
        }
        
        .result-card.pve-card {
            border-color: #00cc66;
        }
        
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        
        .creative-card .badge {
            background: #ff9900;
            color: black;
        }
        
        .pve-card .badge {
            background: #00cc66;
            color: black;
        }
        
        .result-header {
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 12px;
        }
        
        .rev-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        
        .creative-card .rev-title {
            color: #ffb84d;
        }
        
        .pve-card .rev-title {
            color: #4dff9e;
        }
        
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        
        .meta-item {
            font-size: 0.95rem;
        }
        
        .meta-label {
            color: #00ffcc;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }
        
        .meta-value {
            color: white;
        }
        
        .description-box {
            font-size: 1rem;
            line-height: 1.6;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #0099ff;
        }
        
        .creative-card .description-box {
            border-left-color: #ff9900;
        }
        
        .pve-card .description-box {
            border-left-color: #00cc66;
        }
        
        /* Timeline Bar */
        .timeline-container {
            margin-top: 15px;
        }
        
        .timeline-bar {
            height: 14px;
            background: #001122;
            border-radius: 7px;
            position: relative;
            margin: 10px 0;
            overflow: visible;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .timeline-fill {
            height: 100%;
            background: linear-gradient(90deg, #0099ff, #00ffcc);
            border-radius: 7px;
        }
        
        .creative-card .timeline-fill {
            background: linear-gradient(90deg, #ff9900, #ffcc00);
        }
        
        .pve-card .timeline-fill {
            background: linear-gradient(90deg, #00cc66, #00ffcc);
        }
        
        .timeline-indicator {
            width: 16px;
            height: 16px;
            background: #ff3b30;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            top: -2px;
            transform: translateX(-50%);
            box-shadow: 0 0 8px #ff3b30;
            animation: pulse 1.5s infinite alternate;
        }
        
        .timeline-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }
        
        .btn-wiki {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 2px solid #0099ff;
            color: #0099ff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            align-self: flex-start;
            margin-top: 5px;
        }
        
        .creative-card .btn-wiki {
            border-color: #ff9900;
            color: #ff9900;
        }
        
        .creative-card .btn-wiki:hover {
            background: #ff9900;
            color: black;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
        }

            border-color: #00cc66;
            color: #00cc66;
        }
        
        .pve-card .btn-wiki:hover {
            background: #00cc66;
            color: black;
            box-shadow: 0 0 15px rgba(0, 204, 102, 0.4);
        }
        
        .btn-wiki:hover {
            background: #0099ff;
            color: white;
            box-shadow: 0 0 15px rgba(0, 153, 255, 0.4);
        }
        
        /* Grid for compare view */
        .compare-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
        }
        
        @media (max-width: 800px) {
            .compare-view {
                grid-template-columns: 1fr;
            }
        }

            background: rgba(255, 59, 48, 0.15);
            border: 2px solid #ff3b30;
            color: white;
            padding: 20px;
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            text-align: center;
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            width: 100%;
        }
        
        @keyframes pulse {
            from {
                box-shadow: 0 0 4px #ff3b30, 0 0 2px #ff3b30;
            }
            to {
                box-shadow: 0 0 12px #ff3b30, 0 0 6px #ff3b30;
            }
        }
    </style>
</head>

        // Set default date to today in YYYY-MM-DD format
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('date-input').value = todayStr;

        // Mode and date state
        let currentMode = "compare"; // "compare", "creative", "pve"
        let currentDateVal = todayStr;

        // Initialize UI listeners
        const dateInput = document.getElementById('date-input');
        const resultsContainer = document.getElementById('results-container');
        
        dateInput.addEventListener('change', (e) => {
            currentDateVal = e.target.value;
            renderResults();
        });

        // Server selection tabs
        const tabs = document.querySelectorAll('.server-tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.getAttribute('data-mode');
                renderResults();
            });
        });

        // Preset buttons
        const presetButtons = document.querySelectorAll('.btn-preset');
        presetButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                let dateVal = btn.getAttribute('data-date');
                if (dateVal === "today") {
                    dateVal = todayStr;
                }
                dateInput.value = dateVal;
                currentDateVal = dateVal;
                renderResults();
            });
        });

        // Function to search for revisions
        function lookupRevisions(dateStr, revisions) {
            let matched = [];
            for (let rev of revisions) {
                let start = rev.start;
                let end = rev.end || todayStr; // If current, end check extends to today
                if (dateStr >= start && dateStr <= end) {
                    matched.push(rev);
                }
            }
            return matched;
        }

        // Find transition info if gap occurs
        function getTransitionInfo(dateStr, revisions) {
            let lastEnded = null;
            let firstStarted = null;
            
            for (let rev of revisions) {
                if (rev.end && dateStr > rev.end) {
                    if (!lastEnded || rev.end > lastEnded.end) {
                        lastEnded = rev;
                    }
                }
                if (dateStr < rev.start) {
                    if (!firstStarted || rev.start < firstStarted.start) {
                        firstStarted = rev;
                    }
                }
            }
            
            return { lastEnded, firstStarted };
        }

        // Calculate timeline position percentage
        function calculateTimelinePercentage(dateStr, startStr, endStr) {
            const start = new Date(startStr).getTime();
            const end = new Date(endStr || todayStr).getTime();
            const current = new Date(dateStr).getTime();
            
            if (end === start) return 50;
            
            const pct = ((current - start) / (end - start)) * 100;
            return Math.min(100, Math.max(0, pct));
        }

        // Render functions
        function createRevisionCard(rev, serverType, dateStr) {
            const isCreative = serverType === "creative";
            const serverName = isCreative ? "Creative (C)" : "PvE (P)";
            const cardClass = isCreative ? "creative-card" : "pve-card";
            const badgeLabel = isCreative ? "Creative Server" : "PvE Server";
            
            const startStr = rev.start;
            const endStr = rev.end || "(current)";
            const timelineEndVal = rev.end || todayStr;
            const pct = calculateTimelinePercentage(dateStr, startStr, timelineEndVal);
            
            // Build wiki link
            const wikiLink = isCreative 
                ? `https://wiki.nerd.nu/wiki/Category:Creative_creations_(map_revision_${rev.rev})`
                : `https://wiki.nerd.nu/wiki/PvE_r${rev.rev}`;
                
            const generalWikiLink = isCreative
                ? "https://wiki.nerd.nu/wiki/Creative"
                : "https://wiki.nerd.nu/wiki/PvE";

            // Format date presentation
            const parsedStart = new Date(rev.start).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
            const parsedEnd = rev.end 
                ? new Date(rev.end).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' }) 
                : "Ongoing (Current Active Revision)";

            return `
                <div class="result-card ${cardClass}">
                    <span class="badge">${badgeLabel}</span>
                    <div class="result-header">
                        <h3 class="rev-title">Revision ${rev.rev}</h3>
                        <div style="font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-top: 4px;">
                            Active server version during this period
                        </div>
                    </div>
                    
                    <div class="meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Start Date</span>
                            <span class="meta-value">${parsedStart}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">End Date</span>
                            <span class="meta-value">${parsedEnd}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Minecraft Version</span>
                            <span class="meta-value">${rev.mc}</span>
                        </div>
                    </div>

                    <div class="description-box">
                        <strong>Overview & Details:</strong><br>
                        ${rev.desc}
                    </div>

                    <div class="timeline-container">
                        <span class="meta-label">Revision Timeline Progress</span>
                        <div class="timeline-bar">
                            <div class="timeline-fill" style="width: ${pct}%;"></div>
                            <div class="timeline-indicator" style="left: ${pct}%;" title="Selected Date: ${dateStr}"></div>
                        </div>
                        <div class="timeline-labels">
                            <span>${rev.start}</span>
                            <span>${rev.end || "Present"}</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <a href="${wikiLink}" target="_blank" rel="noopener noreferrer" class="btn-wiki">
                            📖 View Revision Category
                        </a>
                        <a href="${generalWikiLink}" target="_blank" rel="noopener noreferrer" class="btn-wiki" style="border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7);">
                            🌐 Main Server Wiki
                        </a>
                    </div>
                </div>
            `;
        }

        function createDowntimeCard(serverType, dateStr, revisions, firstStart) {
            const isCreative = serverType === "creative";
            const serverLabel = isCreative ? "Creative" : "PvE";
            const info = getTransitionInfo(dateStr, revisions);
            
            let messageHtml = "";
            
            if (dateStr < firstStart) {
                const launchDate = isCreative ? "June 10, 2009" : "January 17, 2011";
                messageHtml = `
                    <div class="no-data-card" style="border-color: #ffcc00; background: rgba(255, 204, 0, 0.1);">
                        <strong style="color: #ffcc00; font-size: 1.2rem; display: block; margin-bottom: 8px;">🌌 Pre-Revision Era</strong>
                        The nerd.nu ${serverLabel} server did not have recorded map revisions on <strong>${dateStr}</strong>.<br>
                        (The ${serverLabel} server officially launched on ${launchDate}).
                    </div>
                `;
            } else if (info.lastEnded && info.firstStarted) {
                messageHtml = `
                    <div class="no-data-card">
                        <strong style="color: #ff3b30; font-size: 1.2rem; display: block; margin-bottom: 8px;">⚙️ Server Downtime / Transition</strong>
                        The nerd.nu ${serverLabel} server was in a reset or transition period on <strong>${dateStr}</strong>.<br>
                        This occurred between <strong>Revision ${info.lastEnded.rev}</strong> (ended ${info.lastEnded.end}) and <strong>Revision ${info.firstStarted.rev}</strong> (started ${info.firstStarted.start}).
                    </div>
                `;
            } else {
                messageHtml = `
                    <div class="no-data-card">
                        No recorded revision active for ${serverLabel} on <strong>${dateStr}</strong>.
                    </div>
                `;
            }
            
            return messageHtml;
        }

        function renderResults() {
            // Remove show class, wait brief moment, render, then add show class for nice animation
            resultsContainer.classList.remove('show');
            
            // Format selected date
            const dateStr = currentDateVal;
            if (!dateStr) {
                resultsContainer.innerHTML = '<div class="no-data-card">Please enter or select a valid date.</div>';
                resultsContainer.classList.add('show');
                return;
            }

            setTimeout(() => {
                // Get matched revisions
                const matchedCreative = lookupRevisions(dateStr, creativeRevisions);
                const matchedPvE = lookupRevisions(dateStr, pveRevisions);
                
                let outputHtml = "";

                if (currentMode === "compare") {
                    outputHtml = `<div class="compare-view">`;
                    
                    // Creative Column
                    if (matchedCreative.length > 0) {
                        matchedCreative.forEach(rev => {
                            outputHtml += createRevisionCard(rev, "creative", dateStr);
                        });
                    } else {
                        outputHtml += createDowntimeCard("creative", dateStr, creativeRevisions, "2010-03-14");
                    }
                    
                    // PvE Column
                    if (matchedPvE.length > 0) {
                        matchedPvE.forEach(rev => {
                            outputHtml += createRevisionCard(rev, "pve", dateStr);
                        });
                    } else {
                        outputHtml += createDowntimeCard("pve", dateStr, pveRevisions, "2011-01-17");
                    }
                    
                    outputHtml += `</div>`;
                } else if (currentMode === "creative") {
                    if (matchedCreative.length > 0) {
                        matchedCreative.forEach(rev => {
                            outputHtml += createRevisionCard(rev, "creative", dateStr);
                        });
                    } else {
                        outputHtml += createDowntimeCard("creative", dateStr, creativeRevisions, "2010-03-14");
                    }
                } else if (currentMode === "pve") {
                    if (matchedPvE.length > 0) {
                        matchedPvE.forEach(rev => {
                            outputHtml += createRevisionCard(rev, "pve", dateStr);
                        });
                    } else {
                        outputHtml += createDowntimeCard("pve", dateStr, pveRevisions, "2011-01-17");
                    }
                }

                resultsContainer.innerHTML = outputHtml;
                resultsContainer.classList.add('show');
            }, 150);
        }

        // Initial render
        renderResults();
    </script>
